name = "prueba-arranca"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = true

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Solo /api/* pasa por el Worker; el resto del sitio se sirve igual que antes.
run_worker_first = ["/api/*"]

# Límite de envíos por código y por IP (10 por minuto).
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[previews]
